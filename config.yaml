# config.yaml
scraping:
  headless: true
  concurrency_limit: 3
  timeout_ms: 30000
  # Per-run cap for the incremental detail-page description scrape
  # (src/scraper/fetch_descriptions.py). Resumes where it left off each run.
  description_batch_size: 150
  targets:
    - platform: "facebook_marketplace"
      base_url: "https://www.facebook.com/marketplace/toronto/cars/"
    - platform: "kijiji"
      base_url: "https://www.kijiji.ca/b-cars-trucks/gta-greater-toronto-area/"

ml_pipeline:
  embeddings:
    # Lightweight, lightning-fast embedding model perfect for short vehicle strings
    model_name: "all-MiniLM-L6-v2" 
    batch_size: 32
  
  clustering:
    algorithm: "bisecting_kmeans"
    # Upper bound on K; bisecting splits the highest-inertia cluster until reached.
    # Treated as a ceiling and clamped down for small datasets (see cluster.choose_k).
    initial_k: 250
    bisecting_strategy: "biggest_inertia"
    random_state: 42

  labeling:
    # No external API. run_pipeline writes centroid samples to
    # data/clusters/label_requests.json; the `label-clusters` skill (invoked by
    # the agent) turns them into data/clusters/label_map.json. Clusters without a
    # curated label fall back to a deterministic token-frequency heuristic.
    samples_per_cluster: 10

  valuation:
    # Phase 2: robust (median/MAD) z-score anomaly detection per year+model entity.
    # Prices are mileage-adjusted (src/ml/mileage.py) before scoring.
    min_comps: 5           # entities with fewer comparable listings are not scored
    z_threshold: -2.0      # robust z at or below this => flagged as a deal
    min_discount_pct: 0.15 # ...and price must be at least this far below the median
    suspect_ratio: 0.35    # price below suspect_ratio * median => likely junk, not a deal
    # "Too good to be true" outlier filter (kept in valuation.csv, dropped from
    # deals.csv + notifications at inference; still trained on).
    outlier_ratio: 0.25       # price below this * raw median => implausible discount
    outlier_z: -4.0           # ...or robust z at/below this
    project_car_floor: 400    # a severe-flag car (salvage/blown engine) this cheap is a real listing, not an outlier