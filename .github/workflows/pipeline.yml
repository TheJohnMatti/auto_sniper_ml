name: pipeline

# Hourly scan: scrape (SW Ontario) -> observation log -> INCREMENTAL entity
# resolution (assign to the frozen clusters from the weekly `retrain` job, no
# re-clustering) -> descriptions -> sentiment -> valuation -> phone push.
# Public repo => free Actions minutes. State (raw scrapes, descriptions,
# embedding cache, observation log, model snapshot, notify exactly-once DB) is
# carried between runs in the `pipeline-data-*` cache. The heavy re-cluster +
# label checkpoint lives in retrain.yml (weekly).

on:
  schedule:
    - cron: "27 * * * *"        # hourly at :27. One SW-Ontario scrape is quick;
                                # GitHub's scheduler is best-effort (often 5-15 min
                                # late). For true 5-min sniping, run the scanner as
                                # an always-on loop on a small VM instead (see README).
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: "Reuse cached data/raw instead of hitting Facebook"
        type: boolean
        default: false
      skip_descriptions:
        description: "Skip the slow detail-page description scrape"
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false     # never overlap runs - the cache + notify DB are shared state

permissions:
  contents: read

jobs:
  run:
    runs-on: ${{ vars.PIPELINE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Incremental state from the previous run. First run: nothing to restore,
      # the pipeline builds from scratch.
      - name: Restore pipeline data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: pipeline-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pipeline-data-

      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: models-${{ hashFiles('config.yaml') }}
          restore-keys: |
            models-

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          python -m playwright install chromium

      - name: Run pipeline
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SKIP_SCRAPE: ${{ inputs.skip_scrape && '1' || '0' }}
          SKIP_DESCRIPTIONS: ${{ inputs.skip_descriptions && '1' || '0' }}
        run: bash scripts/run_once.sh

      # Save even on failure so a mid-run crash doesn't lose the scrape / notify DB.
      - name: Persist pipeline data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: pipeline-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload deals snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deals-${{ github.run_id }}
          path: |
            data/processed/deals.csv
            data/processed/valuation.csv
          if-no-files-found: ignore
          retention-days: 14
